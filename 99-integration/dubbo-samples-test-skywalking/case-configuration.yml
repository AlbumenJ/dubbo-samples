# local call through injvm, start test container only
services:
  nacos:
    image: nacos/nacos-server:2.0.0
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - JVM_XMS=350m
      - JVM_XMX=350m
      - JVM_XMN=150m

  agent-init:
    image: apache/skywalking-java-agent:8.13.0-alpine
    volumes:
      - ${_basedir}/target/skywalking:/agent
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "cp -R /skywalking/agent/ /agent/ && echo end > /agent/end"

  agent-wait:
    type: app
    basedir: .
    mainClass: org.apache.dubbo.samples.SkywalkingAgentWait
    volumes:
      - ${_basedir}/target/skywalking:/skywalking
    checkLog: "Skywalking init end"

  provider1:
    type: app
    basedir: .
    mainClass: org.apache.dubbo.samples.Provider1
    environment:
      - "JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar"
    volumes:
      - ${_basedir}/target/skywalking:/skywalking
    systemProps:
      - nacos.address=nacos
    waitPortsBeforeRun:
      - nacos:8848
      - provider2:20882
    checkPorts:
      - 20881
    checkLog: "DubboBootstrap awaiting"
    depends_on:
      - nacos
      - provider2
      - agent-wait

  provider2:
    type: app
    basedir: .
    mainClass: org.apache.dubbo.samples.Provider2
    environment:
      - "JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar"
    volumes:
      - ${_basedir}/target/skywalking:/skywalking
    systemProps:
      - nacos.address=nacos
    waitPortsBeforeRun:
      - nacos:8848
    checkPorts:
      - 20882
    checkLog: "DubboBootstrap awaiting"
    depends_on:
      - nacos
      - agent-wait

  dubbo-samples-test-skywalking-test:
    type: test
    basedir: .
    tests:
      - "**/*IT.class"
    systemProps:
      - nacos.address=nacos
    environment:
      - "JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar"
    volumes:
      - ${_basedir}/target/skywalking:/skywalking
    waitPortsBeforeRun:
      - nacos:8848
      - provider1:20881
      - provider2:20882
    depends_on:
      - nacos
      - provider1
      - provider2